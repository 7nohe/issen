[package]
name = "issen"
version = "0.1.0"
edition = "2021"
description = "Issen (一閃): Japanese document harness for AI agents. One pass, and what a generated document should not have is gone."
license = "MIT"
repository = "https://github.com/7nohe/issen"
readme = "README.md"
keywords = ["japanese", "lint", "textlint", "markdown", "nlp"]
categories = ["command-line-utilities", "text-processing"]
# Set by what the dependency tree demands, not by issen itself; the msrv CI job
# builds with exactly this version.
rust-version = "1.88"


[lib]
name = "issen"
path = "src/lib.rs"

[[bin]]
name = "issen"
path = "src/main.rs"

[[example]]
name = "dump-tokens"
path = "examples/dump_tokens.rs"

[dependencies]
# Morphology backend. Pinned exactly: Lindera bumps majors quickly (5.x -> 6.0 within
# months in 2026), and every bump must pass tests/compat.rs before it is taken.
lindera = { version = "=6.0.0", features = ["embed-ipadic"], optional = true }
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The YAML Organization's continuation of serde_yaml, which its own author
# retired in 2024. Picked over the other forks for being the one with
# institutional stewardship and current releases.
yaml_serde = "0.10"
clap = { version = "4", features = ["derive"] }
unicode-normalization = "0.1"
regex = "1"

[features]
default = ["backend-lindera"]
# Exactly one backend feature must be enabled. Adding another analyzer (Vibrato, a
# MeCab binding, ...) means implementing `tokenizer::Morphology` behind a new feature.
backend-lindera = ["dep:lindera"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dev-dependencies]
serde_json = "1"
