# cargo-about configuration for THIRD-PARTY-LICENSES, the license notices of the
# Rust crates compiled into an issen binary. The release workflow generates it
# and ships it in every archive; CI generates it too, so a dependency under a
# license not listed here fails before a release does.
#
#   cargo about generate --locked --fail about.hbs -o THIRD-PARTY-LICENSES

# For a crate offering a choice of licenses, the first listed here is taken.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
]

# The release targets. A crate compiled into any of them is listed.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# Build scripts, proc macros and dev-dependencies do not end up in the binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true
